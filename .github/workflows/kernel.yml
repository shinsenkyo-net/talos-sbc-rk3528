name: Build & Publish SBC kernel

# Builds the RK3528 SBC kernel (GMAC + RTL8365MB) that scripts/rebuild-imager.sh
# passes to the Talos imager as PKG_KERNEL, and publishes:
#   ghcr.io/<owner>/talos-kernel-rk3528:<tag>         raw bldr output (/rootfs/...)
#   ghcr.io/<owner>/talos-kernel-rk3528:<tag>-talos   Talos layout (use this as PKG_KERNEL)
#
# Until 2026-11-16 this image was only ever built and tagged locally; it was never
# on GHCR. The module-signing key is generated per build, so each run produces a
# different (but equivalent) binary: always rebuild the imager from the kernel you use.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (the -talos image gets "<tag>-talos")'
        required: true
        default: '6.18.39-e24c-1'
  push:
    tags: ['kernel-*']   # e.g. kernel-6.18.39-e24c-2 -> tag 6.18.39-e24c-2

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/talos-kernel-rk3528
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH = first commit timestamp, as in build.sh

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#kernel-}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log --format=%ct "$(git rev-list --max-parents=0 HEAD)")" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same args as the July 2026 local build (Obsidian: "Building Talos SBC RK3528 Overlay").
      - name: Build raw kernel (bldr target kernel-radxa-e24c)
        run: |
          docker buildx build \
            --target=kernel-radxa-e24c --file=Pkgfile \
            --platform=linux/arm64 \
            --provenance=false --sbom=false --progress=plain \
            --build-arg=SOURCE_DATE_EPOCH="${{ steps.tag.outputs.epoch }}" \
            --build-arg=PKGS_PREFIX=ghcr.io/siderolabs --build-arg=PKGS=v1.9.0 \
            --build-arg=TOOLS_PREFIX=ghcr.io/siderolabs --build-arg=TOOLS=v1.9.0 \
            --tag="${IMAGE}:${{ steps.tag.outputs.tag }}" \
            --push .

      - name: Repackage into Talos layout
        run: |
          docker buildx build \
            --file=artifacts/kernel/talos-layout.Dockerfile \
            --platform=linux/arm64 \
            --provenance=false --sbom=false --progress=plain \
            --build-arg=RAW_KERNEL="${IMAGE}:${{ steps.tag.outputs.tag }}" \
            --label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag="${IMAGE}:${{ steps.tag.outputs.tag }}-talos" \
            --push artifacts/kernel

      - name: Verify layout and drivers
        run: |
          REF="${IMAGE}:${{ steps.tag.outputs.tag }}-talos"
          docker pull --platform linux/arm64 "$REF"
          cid=$(docker create --platform linux/arm64 "$REF" /none)
          mkdir -p /tmp/k && docker export "$cid" | tar -x -C /tmp/k
          docker rm "$cid" >/dev/null
          test -s /tmp/k/boot/vmlinuz
          test -s /tmp/k/usr/share/spdx/kernel.spdx.json
          rel=$(ls /tmp/k/usr/lib/modules)
          echo "kernel release: $rel"
          # GMAC (CONFIG_DWMAC_ROCKCHIP -> dwmac-rk.ko) + RTL8365MB are built in (=y),
          # so they must appear in modules.builtin. (vmlinuz is EFI_ZBOOT-compressed,
          # so grepping it for driver strings finds nothing.)
          for m in dwmac-rk rtl8365mb stmmac-platform; do
            grep -q "/${m}.ko" "/tmp/k/usr/lib/modules/${rel}/modules.builtin" \
              || { echo "::error::${m} not built in"; exit 1; }
          done
          echo "vmlinuz sha256: $(sha256sum /tmp/k/boot/vmlinuz | cut -d' ' -f1)"
          {
            echo "### SBC kernel published"
            echo "- \`${REF}\` (PKG_KERNEL)"
            echo "- release \`${rel}\`, vmlinuz sha256 \`$(sha256sum /tmp/k/boot/vmlinuz | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
